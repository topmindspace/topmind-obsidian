name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout topmind-obsidian
        uses: actions/checkout@v5

      - name: Checkout topmind engine
        uses: actions/checkout@v5
        with:
          repository: topmindspace/topmind
          ref: main
          path: .topmind-src

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Typecheck
        env:
          TOPMIND_SRC: ${{ github.workspace }}/.topmind-src
        run: npm run typecheck

      - name: Build
        env:
          TOPMIND_SRC: ${{ github.workspace }}/.topmind-src
        run: npm run build

      - name: Test
        env:
          TOPMIND_SRC: ${{ github.workspace }}/.topmind-src
        run: npm test

      - name: Pack verify
        run: npm run pack:verify

      - name: Pack
        run: npm run pack

      - name: Assert community assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/main.js
          test -f dist/manifest.json
          test -f dist/styles.css
          test -f dist/topmind-obsidian-*.zip || test -f release/topmind-obsidian-*.zip
          node -e '
            const m = require("./manifest.json");
            const p = require("./package.json");
            if (m.version !== p.version) {
              console.error("manifest.version != package.json.version", m.version, p.version);
              process.exit(1);
            }
          '

      - name: Upload pack artifacts
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: pack-smoke
          path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
            release/topmind-obsidian-*.zip
            release/*.SHA256SUMS
          if-no-files-found: error
          retention-days: 3
