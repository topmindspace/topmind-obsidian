# Release Topmind Stream for Obsidian.
# HARD RULE (community plugins): GitHub tag MUST equal manifest.json version
# exactly (4.14.2, not v4.14.2). The community directory looks up releases by
# this tag when installing assets.
name: Release

on:
  push:
    tags:
      # Community directory HARD RULE: GitHub tag MUST equal manifest.version
      # exactly (4.14.2, NOT v4.14.2). Do not use a `v*` trigger — a pushed
      # v-prefixed tag would either fail the assert below or ship a tag the
      # community catalog cannot resolve.
      - "[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Draft tag (must equal manifest.version, no v prefix — e.g. 4.14.2)"
        type: string
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: obsidian-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Checkout topmind engine
        uses: actions/checkout@v5
        with:
          repository: topmindspace/topmind
          ref: main
          path: .topmind-src

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          VER=$(node -p "require('./manifest.json').version")
          PKG=$(node -p "require('./package.json').version")
          if [[ "$VER" != "$PKG" ]]; then
            echo "ERROR: manifest.version ($VER) != package.json.version ($PKG)"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          TAG="${GITHUB_REF_NAME}"
          # Community directory hard rule: GitHub tag MUST equal manifest.version
          # exactly — `4.13.0`, NOT `v4.13.0`. Obsidian matches releases by this tag.
          if [[ "$TAG" != "$VER" ]]; then
            echo "ERROR: tag $TAG must equal manifest.version $VER (no v prefix) — community directory hard rule"
            exit 1
          fi

      - name: Test + Build + Pack
        env:
          TOPMIND_SRC: ${{ github.workspace }}/.topmind-src
        run: |
          npm run ensure-engine
          npm run build
          npm test
          npm run pack:verify
          npm run pack

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DRAFT=""
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.release_tag }}"
            DRAFT="--draft"
          fi
          NOTES="Topmind Stream v${VER}

          ## Install
          - Community plugins (after listing): search **Topmind Stream**
          - BRAT: add \`topmindspace/topmind-obsidian\`
          - Manual: unzip into \`<Vault>/.obsidian/plugins/topmind-stream/\`

          ## Requires
          - Obsidian ≥ 1.13.0
          - Desktop-only (uses Node fs)

          Kernel engine inlined at build time from topmindspace/topmind.
          "
          # Community plugin required assets ONLY at Release root.
          # Obsidian downloads just these three; extra files (zip / SHA256SUMS /
          # versions.json) are flagged as "Release contains extra unsupported
          # files" and never fetched. Manual zip stays in Actions artifacts /
          # local release/ — versions.json stays at repo root for BRAT.
          gh release create "$TAG" $DRAFT \
            --title "v${VER}" \
            --notes "$NOTES" \
            dist/main.js \
            dist/manifest.json \
            dist/styles.css \
            || gh release upload "$TAG" \
              dist/main.js dist/manifest.json dist/styles.css \
              --clobber

          # versions.json for BRAT / community tooling — MERGE into the repo root
          # (not a Release asset). The community directory walks this map from the
          # repository to pick a compatible plugin build for older Obsidian.
          node -e '
            const fs = require("fs");
            const m = require("./manifest.json");
            let versions = {};
            try { versions = JSON.parse(fs.readFileSync("versions.json", "utf8")); } catch {}
            versions[m.version] = m.minAppVersion;
            // Keep insert order stable: oldest → newest by semver-ish string sort
            const sorted = Object.fromEntries(
              Object.entries(versions).sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }))
            );
            fs.writeFileSync("versions.json", JSON.stringify(sorted, null, 2) + "\n");
          '

      # Provenance: let users verify main.js / styles.css were built from this repo.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/main.js
            dist/styles.css

      # Product policy: keep only the newest 2 GitHub Releases.
      - name: Prune old releases (keep 2)
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          KEEP=2
          mapfile -t IDS < <(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq '[.[] | {id, tag: .tag_name, at: (.published_at // .created_at)}] | sort_by(.at) | reverse | .[].id')
          echo "total releases: ${#IDS[@]} keep=${KEEP}"
          if (( ${#IDS[@]} <= KEEP )); then
            echo "nothing to prune"
            exit 0
          fi
          for id in "${IDS[@]:$KEEP}"; do
            echo "deleting release id=${id}"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}" || true
          done
